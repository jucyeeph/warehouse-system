version: '3.8'

services:
  warehouse-app:
    build: ./server
    container_name: warehouse-system
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # 数据和上传文件：群晖同步此目录到另一台NAS
      - ./data:/data
      # 前端静态文件
      - ./public:/public:ro
    environment:
      - PORT=3000
      - DB_PATH=/data/warehouse.db
      - UPLOADS_DIR=/data/uploads
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
