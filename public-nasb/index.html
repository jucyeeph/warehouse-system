<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>仓库管理系统</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 60%,#3b82f6 100%)}
.box{text-align:center;padding:40px 24px}
.logo{font-size:64px;margin-bottom:16px}
h1{color:#fff;font-size:28px;font-weight:800;margin-bottom:8px}
p{color:rgba(255,255,255,.75);font-size:14px;margin-bottom:40px}
.cards{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.card{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  border-radius:18px;padding:28px 32px;cursor:pointer;text-decoration:none;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  transition:all .2s;backdrop-filter:blur(10px)}
.card:hover{background:rgba(255,255,255,.22);transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.card-icon{font-size:44px}
.card-title{color:#fff;font-size:18px;font-weight:700}
.card-desc{color:rgba(255,255,255,.7);font-size:12px;text-align:center;line-height:1.5}
.card-badge{background:rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600}
</style>
</head>
<body>
<div class="box">
  <div class="logo">📦</div>
  <h1>仓库管理系统</h1>
  <p>扫码到货 · 开箱拍照 · 错误审核</p>
  <div class="cards">
    <a class="card" href="/employee.html">
      <div class="card-icon">📱</div>
      <div class="card-title">员工端</div>
      <div class="card-desc">到货扫码<br>开箱拍照<br>错误记录</div>
      <div class="card-badge">手机使用</div>
    </a>
    <a class="card" href="/admin.html">
      <div class="card-icon">🖥</div>
      <div class="card-title">管理端</div>
      <div class="card-desc">错误审核<br>箱子查找<br>采购单管理</div>
      <div class="card-badge">电脑使用</div>
    </a>
  </div>
</div>
</body>
</html>
